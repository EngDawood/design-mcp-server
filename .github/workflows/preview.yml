name: PR Preview

# Every PR: install, test, typecheck — then, once the repo has the two
# Cloudflare secrets, upload a NON-production preview version of the
# Worker and comment its preview URL on the PR.
#
# `wrangler versions upload` only uploads a version; it never promotes
# it. Production changes only when a merged change is deployed
# (`bun run deploy`). There is deliberately no `versions deploy` here.
#
# Secrets state: until the owner adds CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID as GitHub repo secrets, the deploy steps skip
# with a notice in the job summary — tests and typecheck still gate.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      - name: Test
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Check for Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### PR preview skipped"
              echo ""
              echo "The \`CLOUDFLARE_API_TOKEN\` and/or \`CLOUDFLARE_ACCOUNT_ID\` repo secrets are not configured, so no preview was deployed. Tests and typecheck still ran and gated this job."
              echo ""
              echo "Fork PRs never receive secrets, and the repo may simply predate the setup — this is expected, not a failure."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preview version (non-production)
        id: upload
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          bunx wrangler versions upload --message "PR #${{ github.event.pull_request.number }} preview" 2>&1 | tee wrangler-upload.log
          PREVIEW_URL="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler-upload.log | head -n 1 || true)"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          if [ -n "$PREVIEW_URL" ]; then
            {
              echo "### PR preview deployed (non-production)"
              echo ""
              echo "$PREVIEW_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::wrangler versions upload finished but no preview URL was found in its output; see the upload log above."
          fi

      - name: Comment the preview URL on the PR
        if: steps.cf.outputs.ready == 'true' && steps.upload.outputs.preview_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.upload.outputs.preview_url }}';
            const marker = '<!-- design-mcp-server-preview -->';
            const body = [
              marker,
              '### PR preview (non-production)',
              '',
              `**${url}**`,
              '',
              `- Health: ${url}/health`,
              `- MCP endpoint: ${url}/mcp`,
              '',
              '_Uploaded with `wrangler versions upload` — production is untouched until merge + deploy._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
